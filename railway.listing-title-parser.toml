# listing-title-parser Railway service ONLY.
# Linked via service setting railwayConfigFile=/railway.listing-title-parser.toml

[build]
builder = "RAILPACK"
buildCommand = "pip install -r requirements-parse-api.txt"
watchPatterns = [
  "scripts/parse_listing_title.py",
  "scripts/parse_listing_title_api.py",
  "requirements-parse-api.txt",
  "railway.listing-title-parser.toml",
]

[deploy]
startCommand = "python scripts/parse_listing_title_api.py"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
