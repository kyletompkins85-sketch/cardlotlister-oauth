name: Product player price rankings (placeholder)

on:
  workflow_dispatch:
    inputs:
      skip_ebay:
        description: "If true, skip Step 01 (no eBay calls). Runs export + diagnostics only."
        required: false
        default: "true"

      product_name:
        description: "Label for this product (used in output filenames)"
        required: false
        default: "2025 Bowman Draft"

      players_table:
        description: "Supabase players table name"
        required: false
        default: "players_import_2025_bowman_draft"

      prefix:
        description: "Search prefix added before player name (usually product + set)"
        required: false
        default: "2025 Bowman Draft"

      max_players_total:
        description: "Total players to process this run"
        required: false
        default: "50"

      max_players_per_call:
        description: "Players per Worker call (avoid timeouts)"
        required: false
        default: "5"

      ebay_limit:
        description: "eBay browse search limit per query"
        required: false
        default: "200"

      ebay_offset:
        description: "eBay browse search offset per query"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}

      PRODUCT_NAME: ${{ github.event.inputs.product_name }}
      PLAYERS_TABLE: ${{ github.event.inputs.players_table }}
      PREFIX: ${{ github.event.inputs.prefix }}

      MAX_PLAYERS_TOTAL: ${{ github.event.inputs.max_players_total }}
      MAX_PLAYERS_PER_CALL: ${{ github.event.inputs.max_players_per_call }}

      EBAY_LIMIT: ${{ github.event.inputs.ebay_limit }}
      EBAY_OFFSET: ${{ github.event.inputs.ebay_offset }}

      RUN_ID: ${{ github.run_id }}
      EBAY_PAUSE_MS: "250"
      MAX_RETRIES_429: "3"

      PLAYER_COL: "playerName"


    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ----------------------------
      # STEP 01 — Pull players for product + search eBay (via Worker)
      # ----------------------------
      - name: Step 01 - Search player comps for product (via Worker)
        if: github.event.inputs.skip_ebay != 'true'
        run: |
          python workflows/product_player_price_rankings/01_search_product_players.py

      # ----------------------------
      # STEP 02 — Export term_search_items by run_id
      # ----------------------------
      - name: Step 02 - Export term_search_items for this run
        if: github.event.inputs.skip_ebay != 'true'
        run: |
          python workflows/product_player_price_rankings/02_export_term_search_items.py

      - name: Step 02.5 - Diagnostic CT counts (Bowman classifier)
        run: |
          python workflows/product_player_price_rankings/90_ct_counts_from_term_search_export.py --run-id "$RUN_ID" --q "${PREFIX}" --require-all "bowman,draft"

      - name: Step 02.6 - Common keywords in UNCLASSIFIED titles (Bowman classifier)
        run: |
          python workflows/product_player_price_rankings/91_common_words_unclassified_titles.py --run-id "$RUN_ID"

      - name: Debug env presence (no secrets printed)
        run: |
          python - << 'PY'
          import os
          print("SUPABASE_URL set:", bool(os.getenv("SUPABASE_URL")))
          print("SUPABASE_SERVICE_ROLE_KEY set:", bool(os.getenv("SUPABASE_SERVICE_ROLE_KEY")))
          print("WORKER_BASE_URL set:", bool(os.getenv("WORKER_BASE_URL")))
          print("PLAYERS_TABLE:", os.getenv("PLAYERS_TABLE"))
          PY

      - name: Step 00 - Export players list (via Worker, NO eBay)
        run: |
          python workflows/product_player_price_rankings/00_export_players_from_worker.py


      - name: Step 02.7 - Simulate player rankings (Bowman, no eBay)
        run: |
          python workflows/product_player_price_rankings/92_simulate_player_rankings.py \
            --run-id "$RUN_ID" \
            --q "${PREFIX}" \
            --require-all "bowman,draft" \
            --product-prefix "2025 Bowman Draft" \
            --iterations "500000" \
            --min-player-score "95"



      # ----------------------------
      # STEP 03 — Placeholder ranking report (replace methodology later)
      # ----------------------------
      - name: Step 03 - Rank players for product (placeholder)
        if: false
        run: |
          python workflows/product_player_price_rankings/03_rank_players_placeholder.py

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product_player_price_rankings_outputs
          path: workflows/product_player_price_rankings/data/**
          if-no-files-found: warn
