# Cmd+F: CL_ANCHOR_PULL_LISTINGS_DATASET_WORKFLOW_8F2C1A77
name: Pull Listings Dataset

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *" # optional: daily

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Pull dataset from Worker (Supabase) -> data/
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          Q: "2025 Topps Update"
        run: |
          set -euo pipefail

          mkdir -p data
          OUT="data/listings_2025_topps_update.jsonl"
          : > "$OUT"

          LIMIT=1000
          OFFSET=0

          while true; do
            echo "Fetching offset=$OFFSET limit=$LIMIT"

            curl -sS -f \
              "$WORKER_URL/internal/listings/search?q=$(python -c 'import urllib.parse; print(urllib.parse.quote("'"$Q"'"))')&limit=$LIMIT&offset=$OFFSET" \
              -H "x-internal-key: $INTERNAL_API_KEY" \
              -H "Accept: application/json" \
              -o /tmp/resp.json

            RETURNED="$(python -c 'import json; j=json.load(open("/tmp/resp.json")); print(int(j.get("returned", 0)))')"
            echo "Returned=$RETURNED"

            if [ "$RETURNED" -le 0 ]; then
              echo "Done (no more rows)."
              break
            fi

            python -c 'import json; j=json.load(open("/tmp/resp.json")); 
for r in (j.get("rows") or []):
  print(json.dumps(r, ensure_ascii=False))' >> "$OUT"

            OFFSET=$((OFFSET + RETURNED))

            # safety stop (optional)
            if [ "$RETURNED" -lt "$LIMIT" ]; then
              echo "Done (last page)."
              break
            fi
          done

          echo "Wrote $(wc -l < "$OUT") rows to $OUT"

      - name: Commit dataset to repo (if changed)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/*.jsonl || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update listings dataset (2025 Topps Update)"
          git push
