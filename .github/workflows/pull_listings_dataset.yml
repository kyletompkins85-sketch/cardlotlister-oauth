name: Pull listings dataset

on:
  workflow_dispatch:
    inputs:
      q:
        description: Search string (title contains)
        required: true
        default: "2025 Topps Update"

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest

    env:
      WORKER_URL: ${{ secrets.WORKER_URL }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      Q: ${{ inputs.q }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull dataset from Worker into /data
        run: |
          set -euo pipefail

          if [ -z "${WORKER_URL:-}" ]; then
            echo "Missing WORKER_URL secret"
            exit 1
          fi
          if [ -z "${INTERNAL_API_KEY:-}" ]; then
            echo "Missing INTERNAL_API_KEY secret"
            exit 1
          fi
          if [ -z "${Q:-}" ]; then
            echo "Missing Q input"
            exit 1
          fi

          DATA_DIR="data/topps_update_2025"
          mkdir -p "${DATA_DIR}"

          python3 - <<'PY'
          import os, sys, json, time, urllib.parse, urllib.request, datetime

          worker = os.environ["WORKER_URL"].rstrip("/")
          key = os.environ["INTERNAL_API_KEY"].strip()
          q = os.environ["Q"].strip()

          limit = 1000
          offset = 0
          total = 0

          slug = "".join(c.lower() if c.isalnum() else "_" for c in q).strip("_")
          data_dir = "data/topps_update_2025"
          out_jsonl = f"{data_dir}/term_search_items_{slug}.jsonl"
          meta_json = f"{data_dir}/term_search_items_{slug}.meta.json"
          
          def fetch_page(offset):
              url = f"{worker}/internal/termSearchItems/search?q={urllib.parse.quote(q)}&limit={limit}&offset={offset}"
              req = urllib.request.Request(url, headers={"x-internal-key": key, "accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  print(f"HTTP {e.code} from Worker: {body}", file=sys.stderr)
                  raise


          with open(out_jsonl, "w", encoding="utf-8") as f:
              while True:
                  data = fetch_page(offset)
                  rows = data.get("rows", []) or []
                  returned = len(rows)

                  for r in rows:
                      f.write(json.dumps(r, ensure_ascii=False) + "\n")

                  total += returned
                  print(f"offset={offset} returned={returned} total={total}")

                  if returned == 0 or returned < limit:
                      break

                  offset += returned
                  time.sleep(0.2)

          meta = {
              "q": q,
              "worker_url": worker,
              "total_rows": total,
              "pulled_at": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
              "format": "jsonl",
          }

          with open(meta_json, "w", encoding="utf-8") as f:
              json.dump(meta, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"Wrote {total} rows -> {out_jsonl}")
          print(f"Wrote meta -> {meta_json}")
          PY

      - name: Commit dataset to repo (if changed)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/topps_update_2025/*.jsonl data/topps_update_2025/*.meta.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update term_search_items dataset (${Q})"
          git push
