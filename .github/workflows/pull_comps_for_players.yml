name: Pull comps for players + rank (placeholder)

on:
  workflow_dispatch:
    inputs:
      players_table:
        description: "Supabase players table name"
        required: false
        default: "players_import_2025_bowman_draft"
      prefix:
        description: "Search prefix added before player name"
        required: false
        default: "2025 Bowman Draft"
      max_players_total:
        description: "Total players to process this run"
        required: false
        default: "50"
      max_players_per_call:
        description: "Players per Worker call (avoid timeouts)"
        required: false
        default: "5"
      ebay_limit:
        description: "eBay browse search limit per query"
        required: false
        default: "200"
      ebay_offset:
        description: "eBay browse search offset per query"
        required: false
        default: "0"
      force_refresh:
        description: "If true, always call eBay (no cache logic here yet)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}

      PLAYERS_TABLE: ${{ github.event.inputs.players_table }}
      PREFIX: ${{ github.event.inputs.prefix }}
      MAX_PLAYERS_TOTAL: ${{ github.event.inputs.max_players_total }}
      MAX_PLAYERS_PER_CALL: ${{ github.event.inputs.max_players_per_call }}

      EBAY_LIMIT: ${{ github.event.inputs.ebay_limit }}
      EBAY_OFFSET: ${{ github.event.inputs.ebay_offset }}

      FORCE_REFRESH: ${{ github.event.inputs.force_refresh }}

      RUN_ID: ${{ github.run_id }}
      EBAY_PAUSE_MS: "250"
      MAX_RETRIES_429: "3"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ----------------------------
      # STEP 01 — Pull players + run Worker batch searches
      # ----------------------------
      - name: Step 01 - Pull players and search eBay (via Worker)
        run: |
          python workflows/pull_comps_for_players/01_pull_players_and_search.py

      # ----------------------------
      # STEP 02 — Export term_search_items by run_id
      # ----------------------------
      - name: Step 02 - Export term_search_items for this run
        run: |
          python workflows/pull_comps_for_players/02_export_term_search_items_by_run.py

      # ----------------------------
      # STEP 03 — Placeholder ranking report (replace methodology later)
      # ----------------------------
      - name: Step 03 - Rank players (placeholder)
        run: |
          python workflows/pull_comps_for_players/03_rank_players_placeholder.py

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: pull_comps_for_players_outputs
          path: workflows/pull_comps_for_players/data/**
          if-no-files-found: warn
