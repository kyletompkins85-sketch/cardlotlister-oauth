name: Pull comps for largest listings

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Listings filter (passed to Worker as q)"
        required: false
        default: ""
      limit:
        description: "Worker page size (LIMIT env var)"
        required: false
        default: "1000"
      dry_run:
        description: "If true, run only Step 01"
        required: false
        default: "false"
      top_n:
        description: "number of listings to return"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      QUERY: ${{ github.event.inputs.query }}
      LIMIT: ${{ github.event.inputs.limit }}
      RUN_ID: ${{ github.run_id }}
      TOP_N: ${{ github.event.inputs.top_n }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ----------------------------
      # Setup
      # ----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ----------------------------
      # STEP 01 — Pull + sort listings
      # ----------------------------
      - name: Step 01 - Pull and sort listings
        run: |
          python workflows/pull_comps_for_largest_listings/01_pull_and_sort_listings.py

      # ----------------------------
      # STEP 02 — placeholder
      # ----------------------------
      - name: Step 02 - Search listing titles on eBay + store in Supabase
        if: github.event.inputs.dry_run != 'true'
        run: |
          python workflows/pull_comps_for_largest_listings/02_search_titles_and_store_term_search.py

      - name: Step 03 - Export term_search_items (by run_id) to CSV artifact
        if: github.event.inputs.dry_run != 'true'
        run: |
          python workflows/pull_comps_for_largest_listings/03_export_term_search_items_by_run.py

      - name: Step 04 - Build listing vs comps report CSV
        if: github.event.inputs.dry_run != 'true'
        run: |
          python workflows/pull_comps_for_largest_listings/04_build_listing_vs_comps_report.py

      # ----------------------------
      # STEP 03 — placeholder
      # ----------------------------
      - name: Step 03 - (placeholder) Pull comparables and persist raw results
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "TODO: python workflows/pull_comps_for_largest_listings/03_pull_comps_and_store_raw.py"

      # ----------------------------
      # STEP 04 — placeholder
      # ----------------------------
      - name: Step 04 - (placeholder) Score + filter comparables
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "TODO: python workflows/pull_comps_for_largest_listings/04_score_and_filter.py"

      # ----------------------------
      # STEP 05 — placeholder
      # ----------------------------
      - name: Step 05 - (placeholder) Persist final results + publish report
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "TODO: python workflows/pull_comps_for_largest_listings/05_persist_and_report.py"

      - name: Upload outputs (final)
        uses: actions/upload-artifact@v4
        with:
          name: pull_comps_for_largest_listings_outputs
          path: workflows/pull_comps_for_largest_listings/data/**
          if-no-files-found: warn

