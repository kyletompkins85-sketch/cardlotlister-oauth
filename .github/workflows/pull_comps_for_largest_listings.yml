# .github/workflows/pull_comps_for_largest_listings.yml
name: Pull comps for largest listings

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Listings filter (passed to Worker as q)"
        required: false
        default: "2025 Topps Update"
      limit:
        description: "Worker page size (LIMIT env var)"
        required: false
        default: "1000"
      dry_run:
        description: "If true, run only Step 01"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      QUERY: ${{ github.event.inputs.query }}
      LIMIT: ${{ github.event.inputs.limit }}
      RUN_ID: ${{ github.run_id }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ----------------------------
      # Setup
      # ----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ----------------------------
      # STEP 01 — Pull + sort listings
      # Comment this whole step out if you want to skip it.
      # ----------------------------
      - name: Step 01 - Pull and sort listings
        run: |
          python workflows/pull_comps_for_largest_listings/01_pull_and_sort_listings.py

        - name: Upload listings artifact (Step 01 output)
        uses: actions/upload-artifact@v4
        with:
          name: pull_comps_for_largest_listings_outputs
          path: workflows/pull_comps_for_largest_listings/data/**
          if-no-files-found: warn


