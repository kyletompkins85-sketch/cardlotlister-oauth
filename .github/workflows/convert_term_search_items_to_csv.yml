name: Convert term_search_items JSONL to CSV

on:
  workflow_dispatch:
    inputs:
      input_glob:
        description: JSONL glob pattern in repo
        required: true
        default: "data/term_search_items_*.jsonl"
      out_csv:
        description: Output CSV path
        required: true
        default: "data/term_search_items_table.csv"
      columns:
        description: ALL or comma-separated list (e.g. run_id,title,price,seller_username,shipping_cost,shipping_cost_type)
        required: true
        default: "ALL"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Convert JSONL to CSV
        run: |
          set -euo pipefail
          python3 scripts/jsonl_to_table.py "${{ inputs.input_glob }}" \
            --out "${{ inputs.out_csv }}" \
            --columns "${{ inputs.columns }}"

      - name: Commit CSV (if changed)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${{ inputs.out_csv }}" || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Convert term_search_items JSONL to CSV"
          git push
